name: Editor

# The weekly editor. Claude Code runs the weekly-editor skill: it reads the
# week's signals and editorial memory, writes one "The Beat" issue to
# src/content/issues/ (normally short; a long special issue when a thread has
# earned the depth), does a full guide-accuracy pass, reconciles the claims
# reference (distill new claims, re-verify the stalest, stamp stale/retired),
# promotes examples, verifies the skills shelf, and updates memory. A
# fresh-context verification pass and deterministic gates (site build +
# source liveness) run before the commit. Failures open/comment a
# pipeline-failure issue — never silent.
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN.

on:
  schedule:
    # Monday 07:35 UTC — after the week (Mon–Sun) has closed and after the
    # Monday scout run, so the issue sees a complete signals file.
    #
    # The scout now pushes by 06:39 UTC at its worst observed queue delay,
    # and this fires no earlier than 08:46 (07:35 + the 71-min best-case
    # delay), so the ordering holds with ~2h of margin even when the scout
    # is slow and the editor is fast. Minute 35 dodges the congested
    # top-of-hour slot the way the scout's 50 does.
    - cron: "35 7 * * 1"
  workflow_dispatch:
    inputs:
      rescue_from_run:
        description: "Recover a failed run's rescue-patch first (run id). Set automatically by the Recover workflow."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  issues: write
  # apply-rescue downloads a previous failed run's rescue-patch artifact.
  actions: read

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  editor:
    runs-on: ubuntu-latest
    # Raised with the turn caps below — a job timeout kills the run mid-write
    # with no rescue and no guard, which is strictly worse than a turn cap.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Only set when the Recover workflow re-dispatched this run after a
      # failure — recovers that run's uncommitted writing so the retry starts
      # from the work rather than from nothing. Everything recovered still
      # goes through the fact-integrity pass and the gates below.
      - name: Recover a failed run's writing
        uses: ./.github/actions/apply-rescue
        with:
          run_id: ${{ github.event.inputs.rescue_from_run }}
          github_token: ${{ github.token }}

      # Reader feedback arrives as labeled issues (the correction template and
      # the reader-feedback link on /about). Materialise the open ones into a
      # file the writer can read — the skill processes corrections in its
      # accuracy pass and taste signals into TASTE.md, and the close-out step
      # below answers the issues after the gates pass. Deterministic (gh CLI),
      # so the writer's tool allowlist stays read-only.
      - name: Materialise the feedback inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "# Feedback inbox — open reader issues at run time"
            echo
            echo "Generated by the Editor workflow; not committed. Process per"
            echo "the weekly-editor skill: corrections in the accuracy pass,"
            echo "taste signals into TASTE.md."
            echo
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label correction --json number,title,body,url \
              --template '{{range .}}## #{{.number}} (correction) {{.title}}{{"\n"}}{{.url}}{{"\n\n"}}{{.body}}{{"\n\n"}}{{end}}' || true
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label reader-feedback --json number,title,body,url \
              --template '{{range .}}## #{{.number}} (reader-feedback) {{.title}}{{"\n"}}{{.url}}{{"\n\n"}}{{.body}}{{"\n\n"}}{{end}}' || true
          } > editorial/FEEDBACK-INBOX.md
          wc -l editorial/FEEDBACK-INBOX.md

      # The completed Mon–Sun week this run covers — matches the file the
      # skill writes (src/content/issues/<WEEK_ID>.md).
      - name: Resolve the week
        id: week
        run: echo "id=$(date -u -d 'last sunday' +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Write the week
        id: claude
        # See the scout: a max-turns stop exits non-zero and would skip the
        # guard. 2026-08-03 wrote fourteen files — the whole digest — and
        # rescued all of them into an artifact instead of publishing.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Run the weekly-editor skill (.claude/skills/weekly-editor/SKILL.md)
            for the last completed Monday–Sunday week. Write the issue to
            src/content/issues/<WEEK_ID>.md — you decide whether the week
            earns a normal issue or a long special issue; never both. Do the
            full guide-accuracy pass, reconcile the claims reference
            (src/content/claims/: distill new claims, re-verify the ~3 with
            the oldest checked dates, stamp status current/stale/retired —
            never delete a claim file), promote qualifying examples, verify a
            slice of the skills shelf, and update editorial/MEMORY.md. Write
            files only — do not commit or push.
          # recover.yml's retry arrives as a workflow_dispatch from
          # github-actions[bot], and claude-code-action refuses non-human
          # actors unless they are listed here (default: allow no bots). On
          # 2026-08-17 that rejected the first real recovery in 22 seconds --
          # detection, rescue and escalation all worked, and the way back was
          # a closed door. Matching lowercases and strips a trailing "[bot]",
          # so this covers both spellings of the actor. Deliberately not "*":
          # only GitHub's own Actions bot, which is the only thing that can
          # dispatch these workflows.
          allowed_bots: "github-actions"
          show_full_output: true
          # Fable: this is a long, unattended writing run.
          #
          # 90 turns, not 60: this desk does the most per run of any — the
          # issue, the full guide-accuracy pass, claims reconciliation, the
          # skills shelf, the feedback inbox and memory — and 2026-08-03 hit
          # the cap with the digest written but uncommitted. Its own accuracy
          # pass is what `Bash(node scripts/check-*)` is for; that was a
          # denial on 08-03, and denials cost turns.
          claude_args: >-
            --model claude-fable-5
            --max-turns 90
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(date *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(sort *),Bash(git status *),Bash(git diff *),Bash(npm run check*),Bash(npm run scout:query*),Bash(npm run scout:stats*),Bash(node scripts/scout-query.mjs*),Bash(node scripts/scout-stats.mjs*),Bash(node scripts/check-*)"

      # claude-code-action reuses one execution-file path across invocations,
      # so the verify step would overwrite the writer's record and the ledger
      # would write two identical rows. Snapshot the writer's file first.
      - name: Snapshot writer execution file
        id: exec-writer
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          out=""
          if [ -n "$f" ] && [ -f "$f" ]; then
            cp "$f" "$RUNNER_TEMP/exec-writer.json"
            out="$RUNNER_TEMP/exec-writer.json"
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # The editor always writes its issue to src/content/issues/ — except on
      # a redundant re-dispatch, where the skill stops because this week's
      # file already exists. allow_existing keeps that healthy refusal from
      # opening a pipeline-failure issue.
      - name: Guard — writer ran and wrote the issue
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          expect_changes: src/content/issues/
          allow_existing: src/content/issues/${{ steps.week.outputs.id }}.md
          tolerate_max_turns: "true"

      - name: Detect content changes
        id: changes
        run: echo "n=$(git status --porcelain -- src signals editorial | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Verify changed claims (fact-integrity pass)
        id: verify
        if: steps.changes.outputs.n != '0'
        # A different, fresh-context model checks the writer's claims.
        uses: ./.github/actions/fact-integrity
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-5
          desk: editor

      # A clean verify may change nothing — only require that it really ran.
      - name: Guard — verifier ran
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.verify.outputs.execution_file }}

      - name: Run editorial gates
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/editorial-gates

      - name: Append usage ledger
        id: ledger
        env:
          EXEC_WRITER: ${{ steps.exec-writer.outputs.file }}
          EXEC_VERIFY: ${{ steps.verify.outputs.execution_file }}
          MODEL_WRITER: claude-fable-5
          MODEL_VERIFY: claude-sonnet-5
        run: |
          bash scripts/append-ledger.sh
          # The completed Mon–Sun week the issue covers — matches the file
          # the skill writes (src/content/issues/<WEEK_ID>.md), not run date.
          echo "week=$(date -u -d 'last sunday' +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        uses: ./.github/actions/commit-and-push
        with:
          paths: signals/ editorial/ src/content/ usage/
          message: "Editor: issue ${{ steps.ledger.outputs.week }}"

      # After the corrections are committed, answer the issues that reported
      # them (the writer left per-issue replies in the gitignored
      # editorial/FEEDBACK-REPLIES.md). Ordered after the commit so an
      # answered correction is always an applied, published correction.
      - name: Post feedback replies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post-feedback-replies.mjs

      # A failed gate must cost a retry, not the written work — the 07-17
      # backfill run lost a full written digest when the verify pass died.
      - name: Rescue uncommitted content on failure
        if: failure()
        uses: ./.github/actions/rescue-content

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}
