name: Scout

# Daily signals capture. Claude Code runs the daily-scout skill: it sweeps
# practitioner blogs, DevRel communities, and industry research for what's new,
# appends dated one-liners to signals/<week>.md, patches the guide when a hard
# fact changed, and lightly updates editorial memory. A second, fresh-context
# Claude pass then verifies the changed claims against primary sources,
# deterministic gates (site build + source liveness) run, and only then does
# the workflow commit with a rebase-safe push. Deploy publishes via its
# workflow_run trigger. Failures open/comment a pipeline-failure issue — never
# silent.
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token` on a
# Claude Max/Pro login). Without it, the run no-ops with an error in the log.

on:
  schedule:
    # Daily at 02:50 UTC — as late in the US Pacific day as the deadline allows.
    #
    # GitHub queues scheduled jobs: measured delay is 71–216 min (median 163),
    # so this nominal 02:50 actually fires ~04:00–06:25 UTC = 21:00–23:25
    # Pacific. That is the tail of the US day, which is the point.
    #
    # It cannot go later. Pacific midnight is 07:00 UTC, which is 09:00 in
    # Madrid — waiting for the calendar day to close in PT means starting the
    # run at the far end of the window it is supposed to beat. Worst observed
    # delay (216) plus worst observed run (13) already puts the push at 06:39
    # UTC = 08:39 Madrid; anything later breaks the 08:00–09:00 target.
    #
    # Nothing is lost to the gap: the sweep runs `--days 2`, so a post that
    # lands at 23:50 PT after the run is picked up by the next one, still
    # inside its window. Freshness slips by a day for late-evening US posts;
    # the event DB stays complete.
    #
    # Do NOT move this to minute 0 — top-of-hour is the congested slot, and
    # the old "0 5 * * *" landed at 07:30–08:33 UTC, two to three hours late
    # every single day.
    #
    # Holds in winter too: CET (UTC+1) and PST (UTC-8) keep the same 9h gap,
    # so the fire lands 20:00–22:25 PST and the push at 07:39 Madrid worst case.
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus for this sweep (e.g. 'DevRel metrics')"
        required: false
        default: ""
      rescue_from_run:
        description: "Recover a failed run's rescue-patch first (run id). Set automatically by the Recover workflow."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  issues: write
  # apply-rescue downloads a previous failed run's rescue-patch artifact.
  actions: read

# All main-writing workflows share one group so two writers never race a push.
concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    # Raised with the turn caps below — a job timeout kills the run mid-write
    # with no rescue and no guard, which is strictly worse than a turn cap.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # Runners are ephemeral, so without this the transcript cache is empty on
      # every run and each sweep re-downloads what the last one already had.
      # Transcripts are third-party copyrighted work: they live here and in
      # .cache/ only, never in a commit.
      - name: Cache key (UTC day)
        id: cachekey
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Keyed by day, so the Recover workflow's retry reuses the same day's
      # fetches instead of paying for them twice, and falls back to the most
      # recent cache otherwise. This used to key on github.run_id, which is
      # unique per run: it could never hit exactly, always fell through to the
      # restore-key prefix, and wrote a fresh entry every night — the comment
      # said "keyed by day" but the expression did not.
      - name: Cache podcast transcripts
        uses: actions/cache@v4
        with:
          path: .cache/transcripts
          key: podcast-transcripts-${{ steps.cachekey.outputs.day }}
          restore-keys: |
            podcast-transcripts-
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Only set when the Recover workflow re-dispatched this run after a
      # failure — recovers that run's uncommitted writing so the retry starts
      # from the work rather than from nothing. Everything recovered still
      # goes through the fact-integrity pass and the gates below.
      - name: Recover a failed run's writing
        uses: ./.github/actions/apply-rescue
        with:
          run_id: ${{ github.event.inputs.rescue_from_run }}
          github_token: ${{ github.token }}

      - name: Capture today's signals
        id: claude
        # A max-turns stop exits non-zero. Without this the guard below never
        # runs and a sweep's finished signals are thrown away — how
        # 08-02 lost five written files one turn from done. The guard decides.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Run the daily-scout skill (.claude/skills/daily-scout/SKILL.md).
            ${{ github.event.inputs.focus && format('Focus this sweep on: {0}.', github.event.inputs.focus) || '' }}
            Start with the deterministic watchlist sweep
            (`npm run scout:sweep -- --days 2` — it appends every new event
            to signals/db/), triage its report plus your own targeted
            searches, append dated one-liners to signals/<week>.md, enrich
            notable events via scout:enrich, promote every qualifying signal
            to src/content/signals/ (something happened + a
            primary source + two sentences — traction is not a criterion),
            patch any
            guide section under src/content/guide/ whose facts a change
            disproved, and update editorial/MEMORY.md lightly. Fetch podcast
            transcripts with `npm run podcast:transcripts -- --days 2`, distil
            what you fetch into editorial/podcasts/, and drain up to three
            backlog episodes from `--pending` — never at the cost of today's
            sweep. Write files only — do not commit or push.
          show_full_output: true
          # Sonnet by choice: the sweep is short and mechanical; the long
          # unattended *writing* runs (weekly, deep dives) run on Fable.
          #
          # 70 turns, not 40: the 2026-08-01 merge put signal promotion, the
          # podcast fetch, distilling into editorial/podcasts/ and draining
          # three backlog episodes on the same budget the sweep alone used to
          # have, and 08-02 and 08-03 both died at the cap. A cap is a
          # ceiling, not a quota — a sweep that finishes in 30 turns still
          # costs 30.
          #
          # The allowlist is deliberately wide across read-only shell: every
          # denial costs a turn, and a denied command tends to get retried. On
          # 08-02 four identical denied `node scripts/podcast-transcripts.mjs
          # --help` calls plus one denied `date`+`ls` chain burned an eighth of
          # the budget before the sweep had written anything. Nothing here can
          # mutate the tree; the skill still writes through Write/Edit.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 70
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(date *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(sort *),Bash(git status *),Bash(git diff *),Bash(npm run podcast:transcripts*),Bash(node scripts/podcast-transcripts.mjs*),Bash(npm run scout:sweep*),Bash(npm run scout:enrich*),Bash(npm run scout:query*),Bash(node scripts/scout-*),Bash(node scripts/check-*)"

      # claude-code-action reuses one execution-file path across invocations,
      # so the verify step would overwrite the writer's record and the ledger
      # would write two identical rows. Snapshot the writer's file first.
      - name: Snapshot writer execution file
        id: exec-writer
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          out=""
          if [ -n "$f" ] && [ -f "$f" ]; then
            cp "$f" "$RUNNER_TEMP/exec-writer.json"
            out="$RUNNER_TEMP/exec-writer.json"
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # Even a quiet day appends "- (quiet day)" to signals/, so a healthy
      # scout run always leaves changes there.
      - name: Guard — writer ran and captured
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          expect_changes: signals/
          tolerate_max_turns: "true"

      - name: Detect content changes
        id: changes
        run: echo "n=$(git status --porcelain -- src signals editorial | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Verify changed claims (fact-integrity pass)
        id: verify
        if: steps.changes.outputs.n != '0'
        # A separate model in a fresh context checks the writer's claims — the
        # writer never grades its own homework. Opus rather than the writer's
        # Sonnet so the check is genuinely cross-model. 60 turns because there
        # are more signals to verify.
        uses: ./.github/actions/fact-integrity
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          max_turns: "60"
          desk: writer

      # A clean verify may change nothing — only require that it really ran.
      - name: Guard — verifier ran
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.verify.outputs.execution_file }}

      - name: Run editorial gates
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/editorial-gates

      - name: Append usage ledger
        id: ledger
        env:
          EXEC_WRITER: ${{ steps.exec-writer.outputs.file }}
          EXEC_VERIFY: ${{ steps.verify.outputs.execution_file }}
          MODEL_WRITER: claude-sonnet-5
          MODEL_VERIFY: claude-opus-5
        run: |
          bash scripts/append-ledger.sh
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        uses: ./.github/actions/commit-and-push
        with:
          paths: signals/ editorial/ src/content/ usage/
          message: "Scout: signals ${{ steps.ledger.outputs.today }}"

      # A failed gate must cost a retry, not the written work.
      - name: Rescue uncommitted content on failure
        if: failure()
        uses: ./.github/actions/rescue-content

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}
