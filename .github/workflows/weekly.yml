name: Weekly

# Weekly digest. Claude Code runs the weekly-digest skill: it reads the week's
# signals and editorial memory, writes one short "The Week" issue to
# src/content/weekly/, does a full guide-accuracy pass, distills practices,
# and updates memory. The Deep Dive runs on its own weekly schedule now, so
# this workflow no longer dispatches it; if a thread clearly earns the depth
# the editor leaves the topic in editorial/COMMISSION.txt and Thursday's dive
# picks it up as a hint. A fresh-context verification pass and deterministic gates
# (site build + source liveness) run before the commit. Failures open/comment
# a pipeline-failure issue — never silent.
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN.

on:
  schedule:
    # Monday 07:00 UTC — after the week (Mon–Sun) has closed and after the
    # Monday scout run, so the digest sees a complete signals file.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    # Raised with the turn caps below — a job timeout kills the run mid-write
    # with no rescue and no guard, which is strictly worse than a turn cap.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Reader feedback arrives as labeled issues (the correction template and
      # the reader-feedback link on /about). Materialise the open ones into a
      # file the writer can read — the skill processes corrections in its
      # accuracy pass and taste signals into TASTE.md, and the close-out step
      # below answers the issues after the gates pass. Deterministic (gh CLI),
      # so the writer's tool allowlist stays read-only.
      - name: Materialise the feedback inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "# Feedback inbox — open reader issues at run time"
            echo
            echo "Generated by the Weekly workflow; not committed. Process per"
            echo "the weekly-digest skill: corrections in the accuracy pass,"
            echo "taste signals into TASTE.md."
            echo
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label correction --json number,title,body,url \
              --template '{{range .}}## #{{.number}} (correction) {{.title}}{{"\n"}}{{.url}}{{"\n\n"}}{{.body}}{{"\n\n"}}{{end}}' || true
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label reader-feedback --json number,title,body,url \
              --template '{{range .}}## #{{.number}} (reader-feedback) {{.title}}{{"\n"}}{{.url}}{{"\n\n"}}{{.body}}{{"\n\n"}}{{end}}' || true
          } > editorial/FEEDBACK-INBOX.md
          wc -l editorial/FEEDBACK-INBOX.md

      # The completed Mon–Sun week this run covers — matches the file the
      # skill writes (src/content/weekly/<WEEK_ID>.md).
      - name: Resolve the week
        id: week
        run: echo "id=$(date -u -d 'last sunday' +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Write the week
        id: claude
        # See the scout: a max-turns stop exits non-zero and would skip the
        # guard. 2026-08-03 wrote fourteen files — the whole digest — and
        # rescued all of them into an artifact instead of publishing.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Run the weekly-digest skill (.claude/skills/weekly-digest/SKILL.md)
            for the last completed Monday–Sunday week. Write the issue to
            src/content/weekly/<WEEK_ID>.md, do the full guide-accuracy pass,
            distill practices, and update editorial/MEMORY.md. The deep dive
            runs on its own Thursday schedule — you do not trigger it. Only if
            a thread clearly earned the depth, leave its topic as the single
            line of editorial/COMMISSION.txt as a hint for that run; if
            nothing is ripe, write no such file (the normal case). Do NOT
            write the dive in this session. Write files only — do not commit
            or push.
          show_full_output: true
          # Fable: this is a long, unattended writing run.
          #
          # 90 turns, not 60: this desk does the most per run of any — the
          # digest, the full guide-accuracy pass, practice distillation, the
          # skills shelf, the feedback inbox and memory — and 2026-08-03 hit
          # the cap with the digest written but uncommitted. Its own accuracy
          # pass is what `Bash(node scripts/check-*)` is for; that was a
          # denial on 08-03, and denials cost turns.
          claude_args: >-
            --model claude-fable-5
            --max-turns 90
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(date *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(sort *),Bash(git status *),Bash(git diff *),Bash(npm run check*),Bash(node scripts/check-*)"

      # claude-code-action reuses one execution-file path across invocations,
      # so the verify step would overwrite the writer's record and the ledger
      # would write two identical rows. Snapshot the writer's file first.
      - name: Snapshot writer execution file
        id: exec-writer
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          out=""
          if [ -n "$f" ] && [ -f "$f" ]; then
            cp "$f" "$RUNNER_TEMP/exec-writer.json"
            out="$RUNNER_TEMP/exec-writer.json"
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # The editor always writes its issue to src/content/weekly/ — except on
      # a redundant re-dispatch, where the skill stops because this week's
      # file already exists. allow_existing keeps that healthy refusal from
      # opening a pipeline-failure issue.
      - name: Guard — writer ran and wrote the digest
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          expect_changes: src/content/weekly/
          allow_existing: src/content/weekly/${{ steps.week.outputs.id }}.md
          tolerate_max_turns: "true"

      - name: Detect content changes
        id: changes
        run: echo "n=$(git status --porcelain -- src signals editorial | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Verify changed claims (fact-integrity pass)
        id: verify
        if: steps.changes.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            You are the fact-integrity gate for this repo's autonomous editor.
            The previous step edited content but nothing is committed yet. Run
            `git status --porcelain -- src/content signals` to list edited and
            new files, `git diff -- src/content signals` for the edits, and
            read new files in full. For every load-bearing factual claim added
            or changed — figures, survey results, dates, pricing, quotes,
            company moves — verify it against a credible public source with
            WebFetch/WebSearch. Fix what is wrong, revert what cannot be
            verified, and mark anything kept-but-unverified as such in the
            text ("reportedly", with its single source). Do not add new
            stories and do not restyle prose. Write files only — do not
            commit or push.
          show_full_output: true
          # A different, fresh-context model checks the writer's claims. No
          # continue-on-error and no tolerate_max_turns here — a verifier that
          # ran out of turns may have left claims unchecked.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(git status *),Bash(git diff *),Bash(date *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(sort *)"

      # A clean verify may change nothing — only require that it really ran.
      - name: Guard — verifier ran
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.verify.outputs.execution_file }}

      - name: Run editorial gates
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/editorial-gates

      - name: Append usage ledger
        id: ledger
        env:
          EXEC_WRITER: ${{ steps.exec-writer.outputs.file }}
          EXEC_VERIFY: ${{ steps.verify.outputs.execution_file }}
          MODEL_WRITER: claude-fable-5
          MODEL_VERIFY: claude-sonnet-5
        run: |
          bash scripts/append-ledger.sh
          # The completed Mon–Sun week the digest covers — matches the file
          # the skill writes (src/content/weekly/<WEEK_ID>.md), not run date.
          echo "week=$(date -u -d 'last sunday' +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        uses: ./.github/actions/commit-and-push
        with:
          paths: signals/ editorial/ src/content/ usage/
          message: "Weekly: digest ${{ steps.ledger.outputs.week }}"

      # After the corrections are committed, answer the issues that reported
      # them (the writer left per-issue replies in the gitignored
      # editorial/FEEDBACK-REPLIES.md). Ordered after the commit so an
      # answered correction is always an applied, published correction.
      - name: Post feedback replies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post-feedback-replies.mjs

      # continue-on-error: the digest is already pushed by now — a failed
      # dispatch must not fail the run, or Deploy's success gate would leave
      # the published content unbuilt. The next step raises the alarm instead.
      # A failed gate must cost a retry, not the written work — the 07-17
      # backfill run lost a full written digest when the verify pass died.
      - name: Rescue uncommitted content on failure
        if: failure()
        uses: ./.github/actions/rescue-content

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}
