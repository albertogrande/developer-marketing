name: Newsletter

# Sends the week's issue to the confirmed list. The list itself lives on the
# capture service (see newsletter/README.md); this job reads the recipients
# over its authenticated admin endpoint, renders the issue from
# src/content/issues/, and hands each message to the SMTP relay.
#
# Driven by the Editor finishing, not by a clock. It used to fire on a fixed
# Monday 09:00 cron, 85 minutes after the Editor's 07:35 — against a scheduler
# queue delay measured at 71-216 minutes for both. When the Editor had not
# committed yet, send.mjs fell back to `latestIssueId()` and mailed LAST
# week's issue; and because deliveries are idempotent per data/sent/<week>,
# a list that had already received that week was silently skipped entirely and
# the new issue never went out at all. Neither failure was visible.
#
# Now: the week is resolved explicitly and the issue file must exist for it, so
# the wrong week cannot be mailed and a missing issue is a loud failure rather
# than a quiet substitution. The cron remains only as a late backstop for the
# case where the workflow_run event is missed; a send that already happened is
# a no-op on the second pass.
#
# Wiring is optional: with the secrets unset the job reports that the newsletter
# is not configured and exits successfully, so a fork or a fresh clone is not
# permanently red.
#
# Requires secrets NEWSLETTER_SECRET (the same one the service signs with),
# NEWSLETTER_ADMIN_TOKEN, FROM_EMAIL, one mail transport — either RESEND_API_KEY
# or SMTP_HOST/SMTP_USER/SMTP_PASS — and variables NEWSLETTER_API (the service's
# public URL) and SITE_URL.

on:
  # Primary path: the Editor has pushed this week's issue.
  #
  # Note what this does and does not guarantee. It guarantees the issue file
  # exists, which is the failure this trigger was introduced to fix. It does
  # NOT guarantee the public archive link already resolves: the site is built
  # by Vercel off its own push webhook (site.config.mjs), independently of the
  # Deploy workflow, and that build races this job. In practice Vercel takes
  # about a minute and this job runs npm ci + npm test before sending, so the
  # ordering holds with margin — but it is a race, not an interlock. If a
  # subscriber ever reports a dead archive link on send day, that is the cause,
  # and the fix is to gate on the live origin (the probe in deploy.yml's smoke
  # job) rather than to add a sleep.
  workflow_run:
    workflows: ["Editor"]
    types: [completed]
    # Same reason as deploy.yml: filter on the triggering run's branch so a
    # run is never created off-main. The Editor only runs on main today, so
    # this is belt-and-braces rather than a live fix — but a send job is the
    # last place to leave that to convention.
    branches: [main]
  schedule:
    # Backstop only. Monday 15:00 UTC is late enough that the Editor (07:35 +
    # up to 216 min of queue delay) has long finished; if the workflow_run
    # already sent, this pass finds every recipient already served and no-ops.
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to send (blank = newest issue)"
        required: false
        default: ""
      dry_run:
        description: "Render only, send nothing"
        type: boolean
        default: true
      test_to:
        description: "Send a single test message to this address instead of the list"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    # Only off a SUCCESSFUL Editor run on main. A failed Editor means there is
    # no issue to mail, and the week check below would fail the run anyway —
    # better to not start than to open a pipeline-failure issue for it.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # The renderer and the token signing are covered by tests; a broken
      # encoder must not reach an inbox.
      - run: npm test

      # Resolve the week explicitly instead of letting send.mjs fall back to
      # "the newest file in src/content/issues", which is what allowed a
      # not-yet-written week to become last week's issue in the inbox.
      - name: Resolve the week to send
        id: week
        env:
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          set -euo pipefail
          week="${WEEK_INPUT:-$(date -u -d 'last sunday' +%G-W%V)}"
          if [ ! -f "src/content/issues/${week}.md" ]; then
            echo "::error::No issue at src/content/issues/${week}.md — refusing to send. The Editor has not written this week yet, or the week resolved wrong. Nothing was mailed."
            exit 1
          fi
          echo "Sending issue ${week}."
          echo "id=$week" >> "$GITHUB_OUTPUT"

      - name: Check the newsletter is configured
        id: config
        env:
          API: ${{ vars.NEWSLETTER_API }}
          SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$API" ] || [ -z "$SECRET" ]; then
            echo "newsletter not configured (NEWSLETTER_API / NEWSLETTER_SECRET) — skipping."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$SMTP_HOST" ] && [ -z "$RESEND_API_KEY" ]; then
            echo "no mail transport (need RESEND_API_KEY or SMTP_HOST) — skipping."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Send
        if: steps.config.outputs.ready == 'yes'
        env:
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          ADMIN_TOKEN: ${{ secrets.NEWSLETTER_ADMIN_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.NEWSLETTER_API }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thebeat.dev' }}
          # Whichever is set wins; MAIL_TRANSPORT can force one explicitly.
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ vars.FROM_NAME || 'The Beat' }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          WEEK: ${{ steps.week.outputs.id }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_TO: ${{ inputs.test_to }}
        run: |
          args=(--api "$PUBLIC_BASE_URL" --rate 30)
          [ -n "$WEEK" ] && args+=(--week "$WEEK")
          if [ -n "$TEST_TO" ]; then
            args+=(--test "$TEST_TO")
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--yes)
          fi
          echo "send.mjs ${args[*]}"
          node newsletter/send.mjs "${args[@]}"

      # A silent failure means a week with no issue and nobody the wiser.
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}
