name: Evals

# Gate on prompt changes: any PR that touches a writer skill (or the eval
# harness itself) replays the frozen editorial decision points through the
# changed prompt and fails if the pass rate drops below evals/baseline.yml.
# Deliberately NOT on the daily writer path — evals gate prompt changes, not
# content, and each full run costs real model calls (see evals/README.md).

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - "evals/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run (scout | editor | jobs | all)"
        required: false
        default: "all"
      repeat:
        description: "Runs per case. >1 measures the decision variance the baseline floors assume."
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Pinned. This installed unversioned, which made the eval harness the
      # least reproducible surface in the repo while guarding the most
      # reproducibility-sensitive thing in it: a baseline that a CLI change
      # could move without a single line of this repo changing. Bump
      # deliberately, and re-baseline in the same PR if it moves the numbers.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.0.76

      - name: Run evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Through an env var, never interpolated into the shell string —
          # the pattern jobs.yml already documents for the commit message.
          # Dispatch-gated, so this was never reachable without write access,
          # but it was the one place the repo broke its own rule.
          SUITE: ${{ github.event.inputs.suite || 'all' }}
          REPEAT: ${{ github.event.inputs.repeat || '1' }}
        run: |
          # --record writes usage/evals/<date>.md. It was never passed, so no
          # eval history existed at all — every run's numbers vanished with the
          # runner and there was nothing to compare a regression against. The
          # file is uploaded below rather than committed: evals run on PRs.
          node evals/run.mjs --suite "$SUITE" --repeat "$REPEAT" --record | tee eval-output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Eval scoreboard"
            echo
            echo '```'
            cat eval-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-record
          path: |
            usage/evals/
            eval-output.txt
          if-no-files-found: ignore
          retention-days: 90
