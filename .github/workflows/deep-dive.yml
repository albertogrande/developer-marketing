name: Deep Dive

# Deep dive. One researched essay a week, every week — Claude Code runs the
# deep-dive skill on a topic you name or, with none given, the subject the
# editor picks: a ripe thread from editorial memory, else an evergreen one off
# the shelf. A quiet news week is never a reason for silence here. Writes to
# src/content/deep-dives/ and updates memory. A fresh-context verification pass
# and deterministic gates run before the commit; Deploy publishes on
# completion. Runs on its own Thursday schedule — the Weekly does not dispatch
# it, it only leaves an optional topic hint in editorial/COMMISSION.txt.
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN.

on:
  schedule:
    # Thursday 13:00 UTC — one dive a week, every week. Midweek so the editor
    # has Monday's digest plus three days of fresh signals to pick from, and
    # well clear of the morning writers (scout 05:00, newsroom 06:30) that
    # share the `main-writers` concurrency group.
    - cron: "0 13 * * 4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for the dive (leave blank to let the editor pick from memory)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  deep-dive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Topic precedence: an explicit dispatch input, else a hint Monday's
      # digest left in editorial/COMMISSION.txt, else nothing — the editor
      # picks. Read-only here: the hint is consumed (removed and committed as
      # removed) only after the gates pass, so a run that writes the dive and
      # then dies in verify doesn't eat the commission with it — the retry
      # still sees the topic.
      - name: Resolve the topic
        id: topic
        env:
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          topic="$INPUT_TOPIC"
          if [ -z "$topic" ] && [ -f editorial/COMMISSION.txt ]; then
            topic=$(head -1 editorial/COMMISSION.txt | tr -d '\n')
          fi
          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Topic: ${topic:-(none — editor picks)}"

      - name: Write the dive
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Weekly dispatches commissioned dives with the workflow token,
          # so the triggering actor is github-actions[bot] — which the action
          # rejects unless allowed. Only actors with actions:write can
          # dispatch this workflow, so this allows nothing untrusted.
          allowed_bots: "github-actions"
          prompt: >
            Run the deep-dive skill (.claude/skills/deep-dive/SKILL.md).
            ${{ steps.topic.outputs.topic && format('Topic: {0}.', steps.topic.outputs.topic) || 'No topic given — you are the editor: pick this week''s subject yourself, trendy or evergreen, per Step 1 of the skill. This run must produce a dive.' }}
            Write the essay to src/content/deep-dives/ and update
            editorial/MEMORY.md. Write files only — do not commit or push.
          show_full_output: true
          # Fable: this is a long, unattended writing run.
          claude_args: >-
            --model claude-fable-5
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(date *),Bash(ls *)"

      # claude-code-action reuses one execution-file path across invocations,
      # so the verify step would overwrite the writer's record and the ledger
      # would write two identical rows. Snapshot the writer's file first.
      - name: Snapshot writer execution file
        id: exec-writer
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          out=""
          if [ -n "$f" ] && [ -f "$f" ]; then
            cp "$f" "$RUNNER_TEMP/exec-writer.json"
            out="$RUNNER_TEMP/exec-writer.json"
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # A dive run exists to produce an essay — no essay, no success.
      - name: Guard — writer ran and wrote the dive
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          expect_changes: src/content/deep-dives/

      - name: Detect content changes
        id: changes
        run: echo "n=$(git status --porcelain -- src signals editorial | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Verify changed claims (fact-integrity pass)
        id: verify
        if: steps.changes.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions" # same bot-dispatch path as the writer step
          prompt: >
            You are the fact-integrity gate for this repo's autonomous writer.
            The previous step wrote a deep-dive essay but nothing is committed
            yet. Run `git status --porcelain -- src/content` to find the new
            and edited files and read them in full. For every load-bearing
            factual claim — figures, survey results, dates, pricing, quotes,
            company moves — verify it against a credible public source with
            WebFetch/WebSearch. Fix what is wrong, revert what cannot be
            verified, and mark anything kept-but-unverified as such in the
            text. Do not restyle the prose or change the argument. Write
            files only — do not commit or push.
          show_full_output: true
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 50
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(git status *),Bash(git diff *),Bash(date *),Bash(ls *)"

      # A clean verify may change nothing — only require that it really ran.
      - name: Guard — verifier ran
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/writer-guard
        with:
          execution_file: ${{ steps.verify.outputs.execution_file }}

      - name: Run editorial gates
        if: steps.changes.outputs.n != '0'
        uses: ./.github/actions/editorial-gates

      # The gates passed — NOW consume the commission, so the removal is
      # committed with the dive it produced and a stale hint can never steer
      # a second run.
      - name: Consume the commission
        run: rm -f editorial/COMMISSION.txt

      - name: Append usage ledger
        id: ledger
        env:
          EXEC_WRITER: ${{ steps.exec-writer.outputs.file }}
          EXEC_VERIFY: ${{ steps.verify.outputs.execution_file }}
          MODEL_WRITER: claude-fable-5
          MODEL_VERIFY: claude-sonnet-5
        run: |
          bash scripts/append-ledger.sh
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        uses: ./.github/actions/commit-and-push
        with:
          paths: signals/ editorial/ src/content/ usage/
          message: "Deep dive: ${{ steps.ledger.outputs.today }}"

      # A failed gate must cost a retry, not the written work.
      - name: Rescue uncommitted content on failure
        if: failure()
        uses: ./.github/actions/rescue-content

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
