name: Health

# Dead-man's switch for the two writers. The writer guards inside each
# workflow catch a run that errors or no-ops; this watchdog catches the
# failure class those can never see — the schedule itself going quiet (GitHub
# disabling crons on an inactive repo, a broken workflow file on main, an
# action's moving tag regressing to silent success). If the scout hasn't
# committed signals in 2 days, or the editor hasn't committed an issue in 9,
# something upstream is dead — open/comment the pipeline-failure issue.

on:
  schedule:
    # 12:00 UTC daily — hours after the scout's 02:50 run and the Monday
    # editor at 07:35 (both plus up to 3.5h of scheduler queue delay), so a
    # healthy day is never mid-flight when checked.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — the checks read commit dates

      - name: Check desk freshness
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          stale=0

          check() {
            local label="$1" pathspec="$2" max_days="$3"
            local last age_days
            last=$(git log -1 --format=%ct -- "$pathspec")
            if [ -z "$last" ]; then
              echo "::error::$label desk: no commit has ever touched $pathspec"
              stale=1
              return
            fi
            age_days=$(( (now - last) / 86400 ))
            if [ "$age_days" -ge "$max_days" ]; then
              echo "::error::$label desk: last commit touching $pathspec is ${age_days} days old (limit ${max_days})"
              stale=1
            else
              echo "$label desk OK: last commit touching $pathspec is ${age_days} day(s) old."
            fi
          }

          # The scout appends signals every day — even quiet days get a line.
          check "Scout" "signals/" 2
          # The editor commits an issue every Monday; 9 days is one missed
          # Monday plus slack.
          check "Editor" "src/content/issues/" 9

          exit "$stale"

      # Desk freshness says nothing about the newsletter capture service —
      # the list could be down for weeks with content still publishing. When
      # the endpoint is configured (repo variable NEWSLETTER_HEALTH_URL, e.g.
      # https://…/api/health), a dead list service pages the issue like a
      # dead desk. Unset — forks, and this repo pre-launch — it skips.
      - name: Check newsletter capture service
        if: vars.NEWSLETTER_HEALTH_URL != ''
        run: |
          set -euo pipefail
          code=$(curl -s -o health.json -w "%{http_code}" --max-time 20 "${{ vars.NEWSLETTER_HEALTH_URL }}")
          cat health.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::newsletter health endpoint returned $code"
            exit 1
          fi

      # The 2026-07-12 outage was an expired OAuth token the writer guards
      # could only detect after the fact. With CLAUDE_TOKEN_ISSUED set (repo
      # variable, YYYY-MM-DD, updated whenever the secret is rotated), this
      # warns at ~80% of the ~1-year token lifetime — before the expiry, not
      # five days into the silence.
      - name: Check OAuth token age
        if: vars.CLAUDE_TOKEN_ISSUED != ''
        run: |
          set -euo pipefail
          issued=$(date -u -d "${{ vars.CLAUDE_TOKEN_ISSUED }}" +%s)
          age_days=$(( ( $(date -u +%s) - issued ) / 86400 ))
          if [ "$age_days" -ge 292 ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is ${age_days} days old — regenerate with 'claude setup-token', update the secret and CLAUDE_TOKEN_ISSUED"
            exit 1
          fi
          echo "token age OK: ${age_days} day(s)."

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}
