name: Deploy

# The site's home is Vercel (site.config.mjs), which builds main on every push
# — including the editorial bots' commits — with no help needed from here.
# This workflow now does the two jobs that remain on the GitHub side:
#
#   1. Publish the REDIRECT LAYER to GitHub Pages: every URL the old
#      albertogrande.github.io/developer-marketing deployment ever served gets
#      a stub pointing at its new home (scripts/build-redirects.mjs), so old
#      citations, subscriptions, and bookmarks keep resolving.
#   2. Ping IndexNow with the URLs that changed, so the search indexes that
#      feed the answer engines recrawl within hours, not days.
#
# Triggered only by another workflow completing, never by `push` directly.
# The bots' commits do NOT fire `push` for workflows (Vercel's webhook still
# does), so `workflow_run` was always how their content got here — and routing
# human pushes through CI too means a red commit can no longer publish. On
# 2026-08-16 CI run 31954609053 failed and Deploy run 31954608905 shipped the
# same SHA in the same second, because the two fired independently on `push`.
#
# Jobs and Liveness are listed for the same reason as Scout and Editor: they
# also push to main, and without them a jobs-board or mentions commit never
# rebuilt the redirect layer or pinged IndexNow.
#
# Every job below is gated on the triggering run having succeeded (see the
# `if:` on each). A failed run opens a pipeline-failure issue.
on:
  workflow_run:
    workflows: ["CI", "Scout", "Editor", "Jobs", "Liveness"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirects:
    # Publish only for a successful run *on main*. The head_branch test is
    # load-bearing now that CI is a trigger: CI also runs on pull_request, and
    # without it every green PR would publish the redirect layer and ping
    # IndexNow with branch content.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node scripts/build-redirects.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}

  deploy:
    needs: redirects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # The notifier is a local composite action, so the failure path needs a
      # checkout first (this job normally runs without one).
      - name: Checkout for notifier
        if: failure()
        uses: actions/checkout@v4
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}

  # Tell the search indexes what changed (IndexNow → Bing, which is what
  # ChatGPT Search retrieves through). URLs and the key location come from
  # site.config.mjs, so this submits the Vercel URLs. Diffed against the last
  # successful run; degrades to a full ping, never to silence. Best-effort by
  # design: the script exits 0 on API/network failure — a missed ping only
  # delays recrawl — so this job can only redden on real misconfiguration
  # (e.g. a missing key file).
  ping:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The ping script itself is dependency-free, but it maps changed files
      # to routes via scripts/lib/routes.mjs, which parses frontmatter with
      # the yaml package — so the install is not optional here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve previously pinged commit
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')" >> "$GITHUB_OUTPUT"
      - name: Submit changed URLs to IndexNow
        env:
          BASE_SHA: ${{ steps.prev.outputs.sha }}
        run: node scripts/indexnow-ping.mjs

  # Post-deploy smoke test against the live origin: Vercel builds main on its
  # own webhook, and nothing ever confirmed the deploy actually serves. One
  # cheap probe of the machine manifest catches a dead or misconfigured
  # deployment the day it happens instead of whenever a human next looks.
  # Retries because this races Vercel's build; failure opens the issue.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe the live origin
        run: |
          set -euo pipefail
          origin=$(node -e "import('./site.config.mjs').then(m => console.log(m.SITE_ORIGIN.replace(/\/+$/, '')))")
          for i in 1 2 3 4 5; do
            code=$(curl -s -o api.json -w "%{http_code}" --max-time 20 "$origin/api.json") || code=000
            if [ "$code" = "200" ] && node -e "JSON.parse(require('fs').readFileSync('api.json','utf8'))"; then
              echo "smoke OK: $origin/api.json serves parseable JSON."
              exit 0
            fi
            echo "attempt $i: $origin/api.json → $code; retrying in 60s (Vercel may still be building)"
            sleep 60
          done
          echo "::error::live origin failed the smoke test: $origin/api.json → $code"
          exit 1
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          detail: ${{ env.ALERT_DETAIL }}
          alert_email_to: ${{ secrets.ALERT_EMAIL_TO }}
          alert_api_key: ${{ secrets.RESEND_API_KEY }}
          alert_from: ${{ vars.ALERT_FROM_EMAIL }}
          alert_mention: ${{ vars.ALERT_MENTION }}
