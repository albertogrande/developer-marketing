name: CI

# Guards the build. A plain Astro build + Pagefind index on every PR and push,
# plus the newsletter unit tests (tokens, list durability, MIME, SMTP, the
# capture service); no Claude, no quota.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-sources diffs HEAD~1..HEAD to find changed content.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The newsletter's own suite: crypto, storage, encoders and the service.
      - run: npm test
      # Editorial state. This also runs in editorial-gates, but only there is
      # too late: a push that puts editorial/ or signals/ out of bounds passes
      # CI and then fails every autonomous writer until someone notices. The
      # jobs board did exactly that — it added signals/jobs/, which the gate
      # did not know about, and the next scout died with the day's writing in
      # a rescue artifact. Fail on the push instead.
      - run: node scripts/check-editorial.mjs
      # Source liveness on content changed by this PR/push (no-op when the
      # diff touches no content).
      - run: node scripts/check-sources.mjs --changed
