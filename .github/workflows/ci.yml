name: CI

# Guards the build. A plain Astro build + Pagefind index on every PR and push,
# plus the newsletter unit tests (tokens, list durability, MIME, SMTP, the
# capture service); no Claude, no quota.
#
# Four independent jobs, deliberately. These used to be four sequential steps
# in one job, which meant the cheapest gate could hide the most important one:
# on 2026-08-16 a one-line overflow in editorial/MEMORY.md failed
# check-editorial and *skipped* `npm test` and the source check entirely, so
# main sat red with an unrun test suite. Separate jobs each report their own
# verdict, and one red gate never masks the state of the others.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A PR branch that gets three pushes in a minute should run CI once, not three
# times. Never cancel on main: those runs gate Deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # check-refs runs before the build and check-agent-surface after it.
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # store-postgres.test.mjs skips its 19-case store contract unless
    # TEST_DATABASE_URL is set, and nothing ever set it — so the Postgres
    # backend that store-open.mjs selects in production was never verified
    # anywhere, while the NDJSON backend behind the same contract was. `pg` is
    # an optional dependency; a service container is the cheap way to hold both
    # implementations to the one contract.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The newsletter's own suite plus the scripts' parsers: crypto, storage,
      # encoders, the capture service, the sweep and merge logic.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # tsconfig.json has extended astro/tsconfigs/strict all along, but
      # `typescript` and `@astrojs/check` were not dependencies and nothing
      # ever ran a check — the strictness was declarative only, across ~10k
      # lines where most commits are authored unattended at 3am and merged
      # without human review. Static analysis is the cheapest reviewer
      # available and it was entirely absent.
      #
      # Gated at zero errors, not a baseline: the first run found 14, twelve of
      # them in a dead design snapshot that has now been deleted and two real
      # ones in api.json.ts, so there is no backlog to route around.
      - run: npm run typecheck

  editorial:
    name: Editorial state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      # The same editorial-state gate the nightly writers run. Without it here,
      # a structural change (a new directory under signals/, a malformed
      # registry) sails through CI green and detonates at 3am in an unattended
      # run instead — the 08-08..08-14 outage was exactly that.
      # No npm ci: this gate imports only node builtins.
      - run: node scripts/check-editorial.mjs

  sources:
    name: Source liveness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # check-sources diffs HEAD~1..HEAD to find changed content.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Source liveness on content changed by this PR/push (no-op when the
      # diff touches no content).
      - run: node scripts/check-sources.mjs --changed
