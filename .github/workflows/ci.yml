name: CI

# Guards the build. A plain Astro build + Pagefind index on every PR and push,
# plus the newsletter unit tests (tokens, list durability, MIME, SMTP, the
# capture service); no Claude, no quota.
#
# Four independent jobs, deliberately. These used to be four sequential steps
# in one job, which meant the cheapest gate could hide the most important one:
# on 2026-08-16 a one-line overflow in editorial/MEMORY.md failed
# check-editorial and *skipped* `npm test` and the source check entirely, so
# main sat red with an unrun test suite. Separate jobs each report their own
# verdict, and one red gate never masks the state of the others.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A PR branch that gets three pushes in a minute should run CI once, not three
# times. Never cancel on main: those runs gate Deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # check-refs runs before the build and check-agent-surface after it.
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The newsletter's own suite plus the scripts' parsers: crypto, storage,
      # encoders, the capture service, the sweep and merge logic.
      - run: npm test

  editorial:
    name: Editorial state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # The same editorial-state gate the nightly writers run. Without it here,
      # a structural change (a new directory under signals/, a malformed
      # registry) sails through CI green and detonates at 3am in an unattended
      # run instead — the 08-08..08-14 outage was exactly that.
      # No npm ci: this gate imports only node builtins.
      - run: node scripts/check-editorial.mjs

  sources:
    name: Source liveness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # check-sources diffs HEAD~1..HEAD to find changed content.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Source liveness on content changed by this PR/push (no-op when the
      # diff touches no content).
      - run: node scripts/check-sources.mjs --changed
