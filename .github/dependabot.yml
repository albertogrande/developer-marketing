version: 2

# Nothing in this repo is SHA-pinned, and that is deliberate: floating major
# tags on first-party actions pick up security fixes without a standing update
# chore, which matters more here than byte-reproducible workflow runs. The real
# gap was that nothing tracked the drift at all — health.yml's own header names
# "an action's moving tag regressing to silent success" as a failure mode it
# exists to catch, and by then it is already 3am and unattended.
#
# So: watch the drift, review it in daylight, keep the tags floating.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
    commit-message:
      prefix: "CI"
    groups:
      # One PR for the routine first-party bumps; anything else lands on its
      # own so a surprise is visible rather than buried in a batch.
      actions:
        patterns:
          - "actions/*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
